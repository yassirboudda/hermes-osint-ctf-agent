orchestrator:
  provider: deepseek
  model: deepseek-chat
  # DeepSeek V4.1 (or current flagship) decides when to spawn sub-agents

subagents:
  provider: openrouter
  # Orchestrator may choose ANY OpenRouter model suitable for the task, e.g.:
  # - moonshotai/kimi-k2
  # - anthropic/claude-sonnet-4
  # - openai/gpt-5
  # - google/gemini-2.5-pro
  # - x-ai/grok-4
  default_model: ${OPENROUTER_DEFAULT_MODEL}
  routing_hints:
    long_context_osint: prefer large-context OpenRouter models
    vision_stego: prefer multimodal models
    code_forensics: prefer strong coding models
    cheap_classify: prefer fast/cheap models

policy:
  never_use_desktop_ua: true
  never_fuzz: true
  require_team_ok_before_flag_submit: true
